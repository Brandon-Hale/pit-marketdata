name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # No category filter: ubuntu-latest provides a Docker daemon, so the
      # LocalStack integration tests run for real here. Where Docker is absent
      # they skip themselves rather than failing, so the same command is correct
      # on a developer machine too.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
